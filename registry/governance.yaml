# "Govern it all" references shown in the map footer: the frameworks the controls draw on. Frameworks,
# not tools: each is recorded with a primary source and an AI-assessed review of that source (reviewed_by
# names the assessor). Not drift-checked: standards bodies do not publish version feeds we can hash
# without brittle scraping. `drift map build` warns when an entry is past `review_due`.
governance:
- name: OWASP Top 10 for LLM Applications (2026)
