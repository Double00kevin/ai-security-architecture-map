  source_url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
  note: 2026 edition; the cited page shows a publication date of August 3, 2026.
  reviewed_at: '2026-09-27'
  reviewed_by: claude
  review_due: '2026-10-27'
- name: OWASP Top 10 for Agentic Applications
